name: Publish recipes

# Publishes signed bundles to the S3-compatible host (Cloudflare R2 by default; decisions.md U16):
#   main (after CI) -> channel `stable` (recipes/generic + recipes/sites)
#   main (after CI) -> channel `dev`    (everything, including recipes/drafts)
# and garbage-collects unreferenced objects weekly (30-day retention).
#
# Off until configured. Repository variables: REX_PUBLISH_ENABLED=true, REX_BUCKET, REX_PREFIX,
# REX_PUBLIC_URL (public base, e.g. https://recipes.example.com/rex-bundle), REX_KEY_ID, REX_PUBLIC_KEY.
# Secrets: REX_SIGNING_KEY (the key file JSON from `rex bundle keygen`), REX_S3_ENDPOINT,
# REX_S3_ACCESS_KEY_ID, REX_S3_SECRET_ACCESS_KEY. During a key rotation set REX_TRUST_PREVIOUS to the
# old key as key_id:hex (docs/operations.md).

# Runs after CI succeeds on a push to main, so wasm parity, the extension e2e and every gate have passed for
# the exact commit published; never for pull requests (this job holds the signing key).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: rex-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REX_S3_ENDPOINT: ${{ secrets.REX_S3_ENDPOINT }}
  REX_S3_ACCESS_KEY_ID: ${{ secrets.REX_S3_ACCESS_KEY_ID }}
  REX_S3_SECRET_ACCESS_KEY: ${{ secrets.REX_S3_SECRET_ACCESS_KEY }}
  REX_S3_REGION: auto
  TARGET: s3://${{ vars.REX_BUCKET }}/${{ vars.REX_PREFIX }}

jobs:
  publish:
    if: >-
      vars.REX_PUBLISH_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested (workflow_run otherwise checks out the default branch head).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Fixtures of the auto-harvested recipes live in their own repo (decisions.md U31).
      - uses: actions/checkout@v4
        with:
          repository: Shuozeli/rex-fixtures
          path: rex-fixtures
          # Private repo: a read-only deploy key on rex-fixtures, its private half in this repo's secrets.
          ssh-key: ${{ secrets.REX_FIXTURES_SSH_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rex-cli
      - name: Gates (never publish what CI would reject)
        run: |
          ./target/release/rex check recipes --fixtures fixtures --fixtures rex-fixtures --liveness liveness.yaml --liveness liveness-auto.yaml
          ./target/release/rex test --fixtures fixtures --fixtures conformance --fixtures rex-fixtures
      - name: Signing key
        env:
          REX_SIGNING_KEY: ${{ secrets.REX_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$REX_SIGNING_KEY" > "$RUNNER_TEMP/rex-key.json"
          trust=()
          if [ -n "${{ vars.REX_TRUST_PREVIOUS }}" ]; then trust=(--trust "${{ vars.REX_TRUST_PREVIOUS }}"); fi
          printf '%s\n' "${trust[@]}" > "$RUNNER_TEMP/trust-args"
      - name: Publish stable and dev
        if: github.event_name != 'schedule'
        run: |
          mapfile -t trust < "$RUNNER_TEMP/trust-args"
          ./target/release/rex bundle publish --channel stable --recipes recipes/generic --recipes recipes/sites \
            --key "$RUNNER_TEMP/rex-key.json" --to "$TARGET" "${trust[@]}"
          ./target/release/rex bundle publish --channel dev --recipes recipes \
            --key "$RUNNER_TEMP/rex-key.json" --to "$TARGET" "${trust[@]}"
      - name: Verify as a client (public URL)
        if: github.event_name != 'schedule' && vars.REX_PUBLIC_URL != ''
        run: |
          for channel in stable dev; do
            ./target/release/rex bundle verify --url "${{ vars.REX_PUBLIC_URL }}/v1/$channel/" \
              --key-id "${{ vars.REX_KEY_ID }}" --public "${{ vars.REX_PUBLIC_KEY }}"
          done
      - name: Garbage-collect (30-day retention)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mapfile -t trust < "$RUNNER_TEMP/trust-args"
          for channel in stable dev; do
            ./target/release/rex bundle gc --channel "$channel" --key "$RUNNER_TEMP/rex-key.json" --to "$TARGET" \
              --retention-days 30 "${trust[@]}"
          done
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/rex-key.json"
