[package]
name = "rex-wasm"
description = "wasm-bindgen facade over the rex engine (used by the browser extension)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rex-engine = { path = "../rex-engine", default-features = false }
rex-schema = { path = "../rex-schema" }
rex-dom = { path = "../rex-dom" }
rex-bundle = { path = "../rex-bundle" }
rex-redact = { path = "../rex-redact" }
prost-reflect = { version = "0.16", features = ["serde"] }
wasm-bindgen = "=0.2.123"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
url = "2"
