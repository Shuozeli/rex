[package]
name = "rex-proto"
description = "Generated Rust types and the embedded descriptor set for the rex contracts (proto/rex)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }

[build-dependencies]
prost-build = "0.14"
