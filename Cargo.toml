[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Shuozeli/rex"

[profile.release]
lto = true
codegen-units = 1

# Size-optimized build for the wasm engine (cargo build --profile wasm --target wasm32-unknown-unknown).
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true
