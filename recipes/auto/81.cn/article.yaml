# Drafted by `rex draft` with Gemini (flash) on 2026-10-13 from /home/cyuan/projects/scratch/rex-harvest/captures/81.cn/_/a2.
# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: 81.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - 81.cn
    include:
    - ^/yw_208727/[^/]+\.html/?$
  page:
    any:
    - exists: div#article-content
fields:
- path: title
  candidates:
  - css:
      selector: div.article-header h1, div.artichle-info.container h2
      take: TAKE_TEXT
  expect: true
- path: authors
  candidates:
  - css:
      selector: div.article-header div.info span, div.artichle-info.container p span
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: (?:作者|记者|来源)[：:]\s*(.+)
        group: 1
    - trim: {}
- path: published_at
  candidates:
  - css:
      selector: div.article-header i.time, div.artichle-info.container p span
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: (?:发布|时间)[：:]?\s*(\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2}:\d{2})?)
        group: 1
    - trim: {}
    - datetime:
        formats:
        - '%Y-%m-%d %H:%M:%S'
        - '%Y-%m-%d'
        tz: Asia/Shanghai
- path: body_html
  candidates:
  - css:
      selector: div#article-content
      take: TAKE_HTML
  expect: true
- path: body_text
  candidates:
  - css:
      selector: div#article-content
      take: TAKE_BLOCK_TEXT
  expect: true
