# Auto-harvested 2026-10-13 (draft); dev channel until promoted (decisions.md U31).
# Drafted by `rex draft` with Gemini (flash) on 2026-10-13 from /home/cyuan/projects/scratch/rex-harvest/captures/hljnews.cn/_/a1.
# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: hljnews.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - hljnews.cn
    include:
    - ^/jjny/content/2026\-09/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div.article-content
fields:
- path: title
  candidates:
  - css:
      selector: div.article-title
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.article-info div.time
      take: TAKE_TEXT
  expect: true
- path: authors
  candidates:
  - css:
      selector: div.article-info div.writer
      take: TAKE_TEXT
  each: div.article-info div.writer
  fields:
  - path: name
    candidates:
    - css:
        take: TAKE_TEXT
      pipe:
      - regex:
          pattern: 作者[：:]\s*(.+)
          group: 1
    expect: true
- path: body_html
  candidates:
  - css:
      selector: div.article-content
      take: TAKE_HTML
      exclude:
      - .qrcode-box
      - .relation
      - .article-tag
  expect: true
