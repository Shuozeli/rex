# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: rznews.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - rznews.cn
    include:
    - ^/viscms/jinritoutiao1112/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div.article
fields:
- path: title
  candidates:
  - css:
      selector: div.article h2
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.article span.s1
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: 发布时间:([0-9 :-]+)
        group: 1
- path: body_html
  candidates:
  - css:
      selector: div.article > div
      take: TAKE_HTML
  expect: true
