# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: news.cnfol.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - news.cnfol.com
    include:
    - ^/caijingbaike/\d+/[^/]+\.shtml/?$
  page:
    any:
    - exists: h1#Title
    - exists: h3.artTitle
fields:
- path: title
  candidates:
  - css:
      selector: h1#Title, h3.artTitle
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: span#pubtime_baidu, div.artDes
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: \d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}
  expect: true
- path: authors
  each: div.Subtitle, div.artDes
  fields:
  - path: name
    candidates:
    - css:
        selector: span#author_baidu, span
        take: TAKE_TEXT
      pipe:
      - regex:
          pattern: (?:作者|来源)[：:]\s*(.*)
          group: 1
      - trim: {}
    expect: true
- path: body_html
  candidates:
  - css:
      selector: div#Content.ArtM, div.Article
      take: TAKE_HTML
      exclude:
      - center
  expect: true
- path: body_text
  candidates:
  - css:
      selector: div#Content.ArtM, div.Article
      take: TAKE_BLOCK_TEXT
  expect: true
