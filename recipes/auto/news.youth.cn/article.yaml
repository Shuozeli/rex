# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: news.youth.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - news.youth.cn
    include:
    - ^/gn/\d+/[^/]+\.htm/?$
  page:
    all:
    - exists: div.youth_page
fields:
- path: title
  candidates:
  - css:
      selector: div.page_bt p.pbt
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.page_bt p.pwz
    pipe:
    - regex:
        pattern: (\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})
        group: 1
  - meta:
      key: publishdate
- path: body_html
  candidates:
  - css:
      selector: div.page_text div.TRS_Editor
      take: TAKE_HTML
  expect: true
- path: body_text
  candidates:
  - css:
      selector: div.page_text div.TRS_Editor
      take: TAKE_BLOCK_TEXT
- path: authors
  each: span#editor_baidu
  fields:
  - path: name
    candidates:
    - css:
        take: TAKE_TEXT
      pipe:
      - regex:
          pattern: 责任编辑：(.+)
          group: 1
    expect: true
