id: ellenmacarthurfoundation.org/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - ellenmacarthurfoundation.org
    include:
    - ^/[a-z0-9-]+(?:-[a-z0-9-]+)+/?$
  page:
    any:
    - exists: h1[data-testid=mast-heading-below]
fields:
- path: title
  candidates:
  - css:
      selector: h1[data-testid=mast-heading-below]
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: '[data-testid=publish-date] time'
      take: TAKE_ATTRIBUTE
      attribute: datetime
  expect: true
- path: body_html
  candidates:
  - css:
      selector: .main-content-container[role=main]
      take: TAKE_HTML
      exclude:
      - '[data-testid=utility-bar]'
      - '[data-testid=sign-up-footer]'
  expect: true
