id: qianlima.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - qianlima.com
    include:
    - ^/bid-\d+\.html$
  page:
    any:
    - exists: div.owner-entrust-detail
fields:
- path: title
  candidates:
  - css:
      selector: div.detail-header-static div.title-module h1.as-title
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.detail-header-static div.title-module div.operating-area div.release-time span.as-time
      take: TAKE_TEXT
    pipe:
    - datetime:
        formats:
        - '%Y年%m月%d日'
        tz: Asia/Shanghai
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div#detailContentHtml.as-detail-content
      take: TAKE_HTML
  expect: true
