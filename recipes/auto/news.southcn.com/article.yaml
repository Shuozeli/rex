# recipes/sites/ in a PR.
id: news.southcn.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - news.southcn.com
    include:
    - ^/node_eb61ce3e63/[^/]+\.shtml/?$
  page:
    any:
    - exists: '#article_title'
fields:
- path: title
  candidates:
  - css:
      selector: '#article_title'
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: '#pubtime_baidu'
      take: TAKE_TEXT
  expect: true
- path: authors
  each: .m-editor
  fields:
  - path: name
    candidates:
    - css:
        take: TAKE_TEXT
      pipe:
      - regex:
          pattern: 编辑[：:]\s*([^\s责任]+)
          group: 1
    expect: true
- path: body_html
  candidates:
  - css:
      selector: '#content.content'
      take: TAKE_HTML
      exclude:
      - script
      - style
  expect: true
- path: body_text
  candidates:
  - css:
      selector: '#content.content'
      take: TAKE_BLOCK_TEXT
  expect: true
