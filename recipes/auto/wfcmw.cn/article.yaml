id: wfcmw.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - wfcmw.cn
    include:
    - ^/\d+/\d+/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: article.shandianyun
fields:
- path: title
  candidates:
