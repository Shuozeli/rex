      selector: div.page-title + div.page-title
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.page-tips span
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: article.shandianyun
      take: TAKE_HTML
  expect: true
- path: body_text
  candidates:
  - css:
      selector: article.shandianyun
      take: TAKE_BLOCK_TEXT
  expect: true
