# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: p5w.net/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - p5w.net
    include:
    - ^/roll/[^/]+/\d+/[^/]+\.htm/?$
  page:
    any:
    - exists: div.content-body
fields:
- path: title
  candidates:
  - css:
      selector: h3.content-title
      take: TAKE_TEXT
  expect: true
- path: section
  candidates:
  - css:
      selector: span.content-channel
      take: TAKE_TEXT
- path: published_at
  candidates:
  - css:
      selector: span.content-time
      take: TAKE_TEXT
    pipe:
    - datetime:
        formats:
        - '%Y年%m月%d日 %H:%M'
        locale: zh
- path: body_html
  candidates:
  - css:
      selector: div.content-body
      take: TAKE_HTML
  expect: true
