id: cfi.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - cfi.cn
    include:
    - ^/p\d+\.html$
  page:
    any:
    - exists: div#tdcontent
fields:
- path: title
