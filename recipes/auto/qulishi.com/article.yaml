id: qulishi.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - qulishi.com
    include:
    - ^/article/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div.n18_art_content
fields:
- path: title
  candidates:
  - css:
      selector: div.n18_art_content div.n18_art_tt
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.n18_art_info span.fl
      take: TAKE_TEXT
- path: authors
  each: div.n18_art_info span.fr a
  fields:
  - path: name
    candidates:
    - css:
        take: TAKE_TEXT
- path: body_html
  candidates:
  - css:
      selector: div.n18_art_content div.n18_art_con
      take: TAKE_HTML
  expect: true
