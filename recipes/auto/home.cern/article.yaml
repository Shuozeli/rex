id: home.cern/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
root: main.is-layout-flow.wp-block-group.wp-block-group-is-layout-flow
match:
  urls:
    hosts:
    - home.cern
    include:
    - ^/[a-z0-9-]+/?$
  page:
    any:
    - exists: div.entry-content
fields:
- path: title
  candidates:
  - css:
      selector: h2.wp-block-heading
      take: TAKE_TEXT
  expect: true
- path: authors
  each: div.has-global-padding.is-layout-constrained.wp-block-cover-is-layout-constrained.wp-block-cover__inner-container div.is-layout-flex.wp-block-group.wp-block-group-is-layout-flex
  fields:
  - path: name
    candidates:
    - css:
        selector: p
        take: TAKE_TEXT
    expect: true
- path: published_at
  candidates:
  - css:
      selector: time
      take: TAKE_ATTRIBUTE
      attribute: datetime
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div.entry-content
      take: TAKE_HTML
      exclude:
      - .wp-block-cover__inner-container
      - .cern-news
  expect: true
