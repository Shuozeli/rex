id: ihk.de/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - ihk.de
    include:
    - ^/[a-z0-9-]+-\d+$
  page:
    any:
    - exists: article#main.col[role=main]
fields:
- path: title
  candidates:
  - css:
      selector: article#main h1.h1
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: article#main div.detail-text
      take: TAKE_HTML
  expect: true
