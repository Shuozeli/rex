id: jiangsu.gov.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - jiangsu.gov.cn
    include:
    - ^/art/\d+/\d+/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: '#barrierfree_container'
fields:
- path: title
  candidates:
  - css:
      selector: .sp_title
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div#zoom
      take: TAKE_HTML
  expect: true
- path: published_at
  candidates:
  - meta:
      key: PubDate
