id: ah.anhuinews.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - ah.anhuinews.com
    include:
    - ^/szxw/zy/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div#NewsArticleID
fields:
- path: title
  candidates:
  - css:
      selector: div#NewsArticleTitle
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div.content.mt20.wrapper > div.cola.fl > div.info
      take: TAKE_HTML
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.content.mt20.wrapper > div.cola.fl > div.time
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: (\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})
        group: 1
