id: yangtse.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - yangtse.com
    include:
    - ^/news/tt/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div#con.art_txt
fields:
- path: title
  candidates:
  - css:
      selector: div.con_tit p.tit1
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.con_tit p.tit1Ly:nth-of-type(2)
      take: TAKE_TEXT
- path: body_html
  candidates:
  - css:
      selector: div#con.art_txt
      take: TAKE_HTML
  expect: true
- path: body_text
  candidates:
  - css:
      selector: div#con.art_txt
      take: TAKE_BLOCK_TEXT
