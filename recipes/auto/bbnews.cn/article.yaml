# Drafted by `rex draft` with Gemini (flash) on 2026-10-13 from /home/cyuan/projects/scratch/rex-harvest/captures/bbnews.cn/_/a1.
# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: bbnews.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - bbnews.cn
    include:
    - ^/bengbu/\d+/[^/]+/[^/]+\.html/?$
  page:
    any:
    - exists: div.imagetext1-module-1-container
fields:
- path: title
  candidates:
  - css:
      selector: div.title.wrapper
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.message.wrapper span:nth-child(1)
      take: TAKE_TEXT
  expect: true
- path: authors
  candidates:
  - css:
      selector: div.message.wrapper span:nth-child(2)
      take: TAKE_TEXT
  each: div.message.wrapper span:nth-child(2)
  fields:
  - path: name
    candidates:
    - css:
        take: TAKE_TEXT
    expect: true
- path: body_html
  candidates:
  - css:
      selector: div#track-text.content
      take: TAKE_HTML
      exclude:
      - script
      - style
    pipe:
    - join:
        separator: |2+

  expect: true
