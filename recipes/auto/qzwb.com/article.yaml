id: qzwb.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - qzwb.com
    include:
    - ^/gb/content/2026\-10/\d+/[^/]+\.htm/?$
  page:
    any:
    - exists: '#div_title_article'
fields:
- path: title
  candidates:
  - css:
      selector: '#div_title_article'
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: '#div_fbsj'
      take: TAKE_TEXT
- path: body_html
  candidates:
  - css:
      selector: .qzw_article_word
      take: TAKE_HTML
      exclude:
      - '#code_video'
      - .qzw_edit
  expect: true
