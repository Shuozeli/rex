# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: moment.rednet.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - moment.rednet.cn
    include:
    - ^/content/\d+/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: section.news section.content
fields:
- path: title
  candidates:
  - css:
      selector: section.news div.title
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: section.news div.flex.time_new div.left div.row-date
      take: TAKE_TEXT
  expect: true
- path: authors
  each: section.news section.content p:nth-last-of-type(1)
  fields:
  - path: name
    candidates:
    - css:
        take: TAKE_TEXT
      pipe:
      - regex:
          pattern: 作者[：:]\s*(.*)
          group: 1
    - meta:
        key: author
    expect: true
- path: section
  candidates:
  - css:
      selector: section.news div.topic a
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: '[丨|](.*)'
        group: 1
- path: body_html
  candidates:
  - css:
      selector: section.news section.content div.description ct
      take: TAKE_HTML
      exclude:
      - div.c-hide.video-fixed
      - div#toLike.fav
    pipe:
    - join:
        separator: |2+

  expect: true
