# Auto-harvested 2026-10-13 (draft); dev channel until promoted (decisions.md U31).
# Drafted by `rex draft` with Gemini (flash) on 2026-10-13 from /home/cyuan/projects/scratch/rex-harvest/captures/sxgov.cn/_/a5.
# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: sxgov.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - sxgov.cn
    include:
    - ^/content/2026\-10/\d+/[^/]+\.htm/?$
  page:
    any:
    - exists: input#DocIDforCount
fields:
- path: title
  candidates:
  - css:
      selector: div#conleft > div.dahei
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: span#pubtime_baidu
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div#conleft > div.Newsfont
      take: TAKE_HTML
      exclude:
      - .erweima
      - .shareright
  expect: true
