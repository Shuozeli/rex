# Auto-harvested 2026-10-13 (draft); dev channel until promoted (decisions.md U31).
# Drafted by `rex draft` with Gemini (flash) on 2026-10-13 from /home/cyuan/projects/scratch/rex-harvest/captures/hj.cn/_/a1.
# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: hj.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - hj.cn
    include:
    - ^/content/2026\-10/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: '#articleId'
fields:
- path: title
  candidates:
  - css:
      selector: div.content_tit h2
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div.content
      take: TAKE_HTML
  expect: true
- path: published_at
  candidates:
  - css:
      selector: div.source
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: ^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})
        group: 1
- path: authors
  each: div.cont_share div.author
  fields:
  - path: name
    candidates:
    - css:
        take: TAKE_TEXT
    pipe:
    - regex_replace:
        pattern: ^编辑[：:]\s*
    - trim: {}
