# recipes/sites/ in a PR.
id: yancheng.gov.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - yancheng.gov.cn
    include:
    - ^/art/\d+/\d+/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div#zoom.main-txt
fields:
- path: title
  candidates:
  - css:
      selector: p.con-title
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div#zoom.main-txt
      take: TAKE_HTML
  expect: true
- path: body_text
  candidates:
  - css:
      selector: div#zoom.main-txt
      take: TAKE_BLOCK_TEXT
- path: published_at
  candidates:
  - css:
      selector: div.clearfix.small-title > span.date
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: \d{4}-\d{2}-\d{2} \d{2}:\d{2}
