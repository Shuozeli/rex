id: yzwb.net/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - yzwb.net
    include:
    - ^/news/tt/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div#con.art_txt
fields:
- path: title
  candidates:
  - css:
      selector: .con_tit .tit1
      take: TAKE_TEXT
  expect: true
- path: published_at
  candidates:
  - css:
      selector: .con_tit p.tit1Ly:last-child
      take: TAKE_TEXT
- path: body_html
  candidates:
  - css:
      selector: '#con'
      take: TAKE_HTML
  expect: true
