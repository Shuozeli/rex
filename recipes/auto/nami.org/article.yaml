id: nami.org/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - nami.org
    include:
    - ^/[a-z0-9-]+/?$
  page:
    any:
    - json_ld_type:
        types:
        - WebPage
        - Article
fields:
- path: title
  candidates:
  - css:
      selector: h1.wp-block-post-title
      take: TAKE_TEXT
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div.entry-content
      take: TAKE_HTML
      exclude:
      - .wp-block-navigation
      - .wp-block-nami-menu-display
      - .wp-block-nami-state-selector
  expect: true
- path: body_text
  candidates:
  - css:
      selector: div.entry-content
      take: TAKE_BLOCK_TEXT
      exclude:
      - .wp-block-navigation
      - .wp-block-nami-menu-display
      - .wp-block-nami-state-selector
