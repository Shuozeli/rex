# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: antpedia.com/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - antpedia.com
    include:
    - ^/instrument/bidding/\d+/[^/]+\.html/?$
  page:
    any:
    - exists: div.detailsBox
fields:
- path: title
  candidates:
  - css:
      selector: div.module_box div.through h4
      take: TAKE_TEXT
  expect: true
- path: subtitle
  candidates:
  - css:
      selector: div.detailsBox h1.articleTitle
      take: TAKE_TEXT
- path: published_at
  candidates:
  - css:
      selector: div.detailsMessage div.time
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: \d{4}/\d{2}/\d{2}
- path: body_html
  candidates:
  - css:
      selector: div.articleContent div#mainText
      take: TAKE_HTML
- path: body_text
  candidates:
  - css:
      selector: div.articleContent div#mainText
      take: TAKE_BLOCK_TEXT
