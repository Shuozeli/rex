# Unreviewed: add >= 2 redacted fixtures, run `rex test`, review the selectors, then move it to
# recipes/sites/ in a PR.
id: news.sciencenet.cn/article
version: 1
schema: rex.schema.article.v1.Article
extends: generic/article.v1
match:
  urls:
    hosts:
    - news.sciencenet.cn
    include:
    - ^/htmlnews/\d+/\d+/[^/]+\.shtm/?$
  page:
    all:
    - exists: table#content
fields:
- path: published_at
  candidates:
  - css:
      selector: table#content tr td div
      take: TAKE_TEXT
    pipe:
    - regex:
        pattern: 发布时间：([\d/\s:]+)
        group: 1
    - trim: {}
  expect: true
- path: body_html
  candidates:
  - css:
      selector: div#content1
      take: TAKE_HTML
  expect: true
- path: body_text
  candidates:
  - css:
      selector: div#content1
      take: TAKE_BLOCK_TEXT
