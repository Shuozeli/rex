# Yahoo Finance quote page -> rex.schema.finance.v1.Quote (decisions.md U37). Stocks, ETFs, mutual funds,
# indexes, currencies, futures and crypto share one layout. Live values sit in fin-streamer elements named by
# data-field; rows without one are found by their label's title. The market-time notice gives a time but no
# date ("At close: 4:00:01 PM EDT"), so as_of is left out; it still tells the market state.
id: finance.yahoo.com/quote
version: 1
schema: rex.schema.finance.v1.Quote
match:
  urls:
    hosts: ["finance.yahoo.com"]
    include: ["^/quote/[^/]+/?$"]
  page:
    all:
      - exists: "[data-testid=qsp-price]"
fields:
  - path: symbol
    candidates:
      - url: { part: URL_PART_PATH_SEGMENT, segment: 1 }
    pipe:
      - decode: { kind: DECODE_KIND_PERCENT }

  - path: name               # "Apple Inc. (AAPL)"
    candidates:
      - css: { selector: "[data-testid=quote-hdr] h1" }
    pipe:
      - regex_replace: { pattern: "\\s*\\([^)]*\\)$", with: "" }

  - path: type
    candidates:
      - url: { part: URL_PART_HREF }
        pipe:
          - regex: { pattern: "/quote/(?:[^/]+-USD|[^/]+=X|[^/]+=F|%5E[^/]+|\\^[^/]+)/?$", group: 0 }
          - regex_replace: { pattern: "^.*-USD/?$", with: "INSTRUMENT_TYPE_CRYPTO" }
          - regex_replace: { pattern: "^.*=X/?$", with: "INSTRUMENT_TYPE_CURRENCY" }
          - regex_replace: { pattern: "^.*=F/?$", with: "INSTRUMENT_TYPE_FUTURE" }
          - regex_replace: { pattern: "^/quote/(%5E|\\^).*$", with: "INSTRUMENT_TYPE_INDEX" }
      - css: { selector: "[data-testid=quote-statistics] .label[title^='Expense Ratio']", take: TAKE_ATTRIBUTE, attribute: title }
        pipe:   # ETFs show "Expense Ratio (net)", mutual funds "Expense Ratio"
          - map: { entries: [ { from: "Expense Ratio (net)", to: "INSTRUMENT_TYPE_ETF" }, { from: "Expense Ratio", to: "INSTRUMENT_TYPE_FUND" } ], drop_unmapped: true }
      - constant: { value: "INSTRUMENT_TYPE_STOCK" }

  - path: exchange           # header spans: ["NasdaqGS - BOATS Real Time Price", "USD"]; crypto: ["Cryptocurrency", "USD", "#1 by Market Cap"]
    candidates:
      - css: { selector: "[data-testid=quote-hdr] .exchange > span:not([aria-hidden])" }
    pipe:
      - slice: { start: 0, end: 1 }
      - regex: { pattern: "^(.+?)(?:\\s+-\\s.*)?$", group: 1 }
      - filter: { pattern: "^Cryptocurrency$", invert: true }

  - path: currency
    candidates:
      - css: { selector: "[data-testid=quote-hdr] .exchange > span:not([aria-hidden])" }
    pipe:
      - filter: { pattern: "^[A-Z]{3}$" }
      - slice: { start: 0, end: 1 }

  - path: rank               # crypto: "#1 by Market Cap"
    candidates:
      - css: { selector: "[data-testid=quote-hdr] .exchange > span:not([aria-hidden])" }
    pipe:
      - regex: { pattern: "^#(\\d+) by Market Cap", group: 1 }

  - path: price
    expect: true
    candidates:
      - css: { selector: "[data-testid=qsp-price]" }

  - path: change
    candidates:
      - css: { selector: "[data-testid=qsp-price-change]" }

  - path: change_percent     # "(+0.50%)"
    candidates:
      - css: { selector: "[data-testid=qsp-price-change-percent]" }

  - path: market_state       # "At close: ...", "As of 9:03 PM UTC. Market Open.", "Pre-Market: ...", "After hours: ..."
    candidates:
      - css: { selector: "[slot=marketTimeNotice]" }
    pipe:
      - slice: { start: 0, end: 1 }
      - regex: { pattern: "(?i)^(at close|pre-market|after hours|overnight|as of .*market open)", group: 1 }
      - regex_replace: { pattern: "(?i)^at close$", with: "MARKET_STATE_CLOSED" }
      - regex_replace: { pattern: "(?i)^pre-market$", with: "MARKET_STATE_PRE" }
      - regex_replace: { pattern: "(?i)^(after hours|overnight)$", with: "MARKET_STATE_POST" }
      - regex_replace: { pattern: "(?i)^as of .*market open$", with: "MARKET_STATE_OPEN" }

  - path: previous_close
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=regularMarketPreviousClose]" }

  - path: open
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=regularMarketOpen]" }

  - path: day_low            # "341.72 - 347.07"
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=regularMarketDayRange]" }
    pipe:
      - regex: { pattern: "^([\\d.,]+)\\s*-", group: 1 }

  - path: day_high
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=regularMarketDayRange]" }
    pipe:
      - regex: { pattern: "-\\s*([\\d.,]+)$", group: 1 }

  - path: year_low
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=fiftyTwoWeekRange]" }
    pipe:
      - regex: { pattern: "^([\\d.,]+)\\s*-", group: 1 }

  - path: year_high
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=fiftyTwoWeekRange]" }
    pipe:
      - regex: { pattern: "-\\s*([\\d.,]+)$", group: 1 }

  - path: volume
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=regularMarketVolume]" }
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title^='Volume']) .value" }

  - path: avg_volume
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=averageVolume]" }

  - path: market_cap
    candidates:
      - css: { selector: "[data-testid=quote-statistics] fin-streamer[data-field=marketCap]" }

  - path: pe_ratio           # (Yahoo tags the EPS row's streamer as trailingPE too, so rows go by label)
    candidates:
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title^='PE Ratio']) .value" }
    pipe:
      - filter: { pattern: "\\d" }

  - path: eps
    candidates:
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title^='EPS']) .value" }
    pipe:
      - filter: { pattern: "\\d" }

  - path: dividend_yield     # "1.08 (0.32%)" / "-- (0.32%)" for stocks, "1.05%" for funds
    candidates:
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title^='Forward Dividend']) .value" }
        pipe:
          - regex: { pattern: "\\(([-\\d.]+)%\\)", group: 1 }
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title='Yield']) .value" }

  - path: expense_ratio
    candidates:
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title^='Expense Ratio']) .value" }

  - path: net_assets
    candidates:
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title='Net Assets']) .value" }

  - path: circulating_supply
    candidates:
      - css: { selector: "[data-testid=quote-statistics] li:has(.label[title='Circulating Supply']) .value" }

  - path: stats
    each: "[data-testid=quote-statistics] li"
    fields:
      - path: name
        candidates:
          - css: { selector: ".label", take: TAKE_ATTRIBUTE, attribute: title }
          - css: { selector: ".label" }
      - path: value
        candidates:
          - css: { selector: ".value" }

  - path: url
    candidates:
      - link: { rel: canonical }
      - url: { part: URL_PART_HREF }
