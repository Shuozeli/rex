# Best Buy search results -> rex.schema.commerce.v1.ProductList (decisions.md U35). Product pages are not
# covered: they reset direct automated navigations (HTTP/2 protocol error). The screen-reader price text is
# the current price; "Comp. Value" is the comparison price. Sponsored products sit in carousels outside the
# result list, and cards below the fold render only after scrolling.
id: bestbuy.com/search
version: 1
schema: rex.schema.commerce.v1.ProductList
match:
  urls:
    hosts: ["bestbuy.com"]
    include: ["^/site/searchpage\\.jsp"]
  page:
    all:
      - exists: "li.product-list-item"
fields:
  - path: query
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: st }

  - path: page
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: cp }
    pipe:
      - default: { value: "1" }

  - path: items
    expect: true
    each: "li.product-list-item[data-product-id]"
    each_index: rank
    fields:
      - path: id
        candidates:
          - css: { take: TAKE_ATTRIBUTE, attribute: data-product-id }
      - path: title            # "HP - 14\" Laptop - Intel N150 ..."
        candidates:
          - css: { selector: "h3.product-title" }
      - path: url
        candidates:
          - css: { selector: "a.product-list-item-link", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex_replace: { pattern: "[?#].*$", with: "" }
      - path: price
        candidates:
          - css: { selector: ".sr-only" }
        pipe:
          - filter: { pattern: "^\\$[\\d,.]+$" }
          - slice: { start: 0, end: 1 }
          - number: {}
      - path: currency
        candidates:
          - constant: { value: "USD" }
      - path: rating           # "Rating 4.5 out of 5 stars with 98 reviews"
        candidates:
          - css: { selector: "p.visually-hidden" }
        pipe:
          - filter: { pattern: "^Rating " }
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "^Rating ([\\d.]+) out of", group: 1 }
      - path: review_count
        candidates:
          - css: { selector: "p.visually-hidden" }
        pipe:
          - filter: { pattern: "^Rating " }
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "with ([\\d,]+) reviews?", group: 1 }
          - number: {}
      - path: image
        candidates:
          - css: { selector: "img[data-testid=product-image]", take: TAKE_ATTRIBUTE, attribute: src }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex_replace: { pattern: ";.*$", with: "" }
