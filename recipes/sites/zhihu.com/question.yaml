# Zhihu question page -> rex.schema.social.v1.Thread (decisions.md U33). The question is the post; answers
# carry microdata (upvoteCount, dateCreated, commentCount, url). Only the answers the page has loaded are
# present.
id: zhihu.com/question
version: 1
schema: rex.schema.social.v1.Thread
match:
  urls:
    hosts: ["zhihu.com"]
    include: ["^/question/\\d+"]
  page:
    all:
      - exists: "h1.QuestionHeader-title"
fields:
  - path: title
    expect: true
    candidates:
      - css: { selector: "h1.QuestionHeader-title", scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: 0, end: 1 }

  - path: url
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "^(https://[^/]+/question/\\d+)", group: 1 }

  - path: tags
    candidates:
      - css: { selector: ".QuestionHeader-topics .Tag", scope: CSS_SCOPE_DOCUMENT }

  - path: reply_count            # "141 个回答"
    candidates:
      - css: { selector: ".List-headerText", scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - number: {}

  - path: post.id
    candidates:
      - url: { part: URL_PART_PATH_SEGMENT, segment: 1 }

  - path: post.text
    candidates:
      - css: { selector: ".QuestionHeader-detail .RichText", scope: CSS_SCOPE_DOCUMENT }
      - field: { path: title }

  - path: post.views              # NumberBoard: followers, then views
    candidates:
      - css: { selector: ".NumberBoard-itemValue", take: TAKE_ATTRIBUTE, attribute: title, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: -1, end: 0 }

  - path: post.replies
    candidates:
      - field: { path: reply_count }

  - path: post.url
    candidates:
      - field: { path: url }

  - path: replies
    each: ".AnswerItem"
    fields:
      - path: id
        candidates:
          - css: { take: TAKE_ATTRIBUTE, attribute: name }
      - path: author.name
        candidates:
          - css: { selector: ".AuthorInfo-name" }
          - css: { selector: "meta[itemprop=name]", take: TAKE_ATTRIBUTE, attribute: content }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: author.url
        candidates:
          - css: { selector: ".AuthorInfo-name a", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: text
        candidates:
          - css: { selector: ".RichContent-inner" }
      - path: published_at
        candidates:
          - css: { selector: "meta[itemprop=dateCreated]", take: TAKE_ATTRIBUTE, attribute: content }
      - path: likes
        candidates:
          - css: { selector: "meta[itemprop=upvoteCount]", take: TAKE_ATTRIBUTE, attribute: content }
      - path: replies
        candidates:
          - css: { selector: "meta[itemprop=commentCount]", take: TAKE_ATTRIBUTE, attribute: content }
      - path: url
        candidates:
          - css: { selector: "meta[itemprop=url][content*='/answer/']", take: TAKE_ATTRIBUTE, attribute: content }
