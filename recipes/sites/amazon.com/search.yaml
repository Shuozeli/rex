# Amazon search result page -> rex.schema.commerce.v1.ProductList (decisions.md U32). Ads carry the AdHolder
# class; `rank` is the position among the extracted results.
id: amazon.com/search
version: 1
schema: rex.schema.commerce.v1.ProductList
match:
  urls:
    hosts: ["amazon.com"]
    include: ["^/s\\?", "^/s/"]
  page:
    all:
      - exists: "div[data-component-type=s-search-result]"
fields:
  - path: query
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: k }
      - css: { selector: "input#twotabsearchtextbox", take: TAKE_ATTRIBUTE, attribute: value, scope: CSS_SCOPE_DOCUMENT }

  - path: page
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: page }
    pipe:
      - default: { value: "1" }

  - path: items
    expect: true
    each: "div[data-component-type=s-search-result][data-asin]:not([data-asin=''])"
    each_index: rank
    fields:
      - path: id
        candidates:
          - css: { take: TAKE_ATTRIBUTE, attribute: data-asin }
      - path: title           # sponsored brand rows put the brand in a first h2
        candidates:
          - css: { selector: "[data-cy=title-recipe] h2" }
          - css: { selector: "h2" }
        pipe:
          - slice: { start: -1, end: 0 }
      - path: url
        candidates:
          - css: { selector: "[data-cy=title-recipe] a", take: TAKE_ATTRIBUTE, attribute: href }
          - css: { selector: "a.a-link-normal.s-no-outline", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "^(.*?/dp/[A-Z0-9]{10})", group: 1 }
      - path: price
        candidates:
          - css: { selector: ".a-price:not(.a-text-price) .a-offscreen" }
        pipe:
          - slice: { start: 0, end: 1 }
          - number: {}
      - path: currency
        candidates:
          - css: { selector: ".a-price:not(.a-text-price) .a-price-symbol" }
            pipe:
              - slice: { start: 0, end: 1 }
              - map: { entries: [ { from: "$", to: "USD" }, { from: "€", to: "EUR" }, { from: "£", to: "GBP" } ] }
          - constant: { value: "USD" }
      - path: rating
        candidates:
          - css: { selector: ".a-icon-alt" }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "([\\d.]+) out of", group: 1 }
      - path: review_count
        candidates:
          - css: { selector: "[data-cy=reviews-block] a[aria-label$=ratings]", take: TAKE_ATTRIBUTE, attribute: aria-label }
        pipe:
          - number: {}
      - path: image
        candidates:
          - css: { selector: "img.s-image", take: TAKE_ATTRIBUTE, attribute: src }
      - path: sponsored
        candidates:
          - css: { take: TAKE_ATTRIBUTE, attribute: class }
            pipe:
              - regex: { pattern: "(AdHolder)", group: 1 }
              - map: { entries: [ { from: "adholder", to: "true" } ] }
        pipe:
          - default: { value: "false" }
