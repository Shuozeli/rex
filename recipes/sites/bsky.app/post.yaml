# Bluesky post page -> rex.schema.social.v1.Thread (decisions.md U35). Rendered page only (react-native-web,
# so class names are generated and unusable). Every post is [data-testid=postThreadItem-by-<handle>]; the
# focal one is the item with the expanded counters (likeCount-expanded), the rest (parents above, replies
# below) are replies. The page's JSON-LD (DiscussionForumPosting) gives the focal post's exact text and UTC
# time; it lists only the first 10 comments, so replies come from the DOM. The DOM shows times in the viewer's
# local zone without saying which, so replies carry no published_at.
id: bsky.app/post
version: 2
schema: rex.schema.social.v1.Thread
match:
  urls:
    hosts: ["bsky.app"]
    include: ["^/profile/[^/]+/post/[a-z0-9]+"]
  page:
    all:
      - exists: "[data-testid^=postThreadItem-by-]"
fields:
  - path: url
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "^(https://[^/]+/profile/[^/]+/post/[a-z0-9]+)", group: 1 }

  - path: post.id
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "/post/([a-z0-9]+)", group: 1 }

  - path: post.url
    candidates:
      - field: { path: url }

  - path: post.author.name   # the focal item's links: "<name>'s avatar", then "<name>"
    expect: true
    candidates:
      - css: { selector: "[data-testid^=postThreadItem-by-]:has([data-testid=likeCount-expanded]) a[href^='/profile/'][aria-label]", take: TAKE_ATTRIBUTE, attribute: aria-label }
    pipe:
      - filter: { pattern: "'s avatar$", invert: true }
      - slice: { start: 0, end: 1 }

  - path: post.author.handle
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "/profile/([^/]+)/post/", group: 1 }

  - path: post.author.url
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "^(https://[^/]+/profile/[^/]+)/post/", group: 1 }

  - path: post.author.verified
    candidates:
      - css: { selector: "[data-testid^=postThreadItem-by-]:has([data-testid=likeCount-expanded]) button[aria-label$=verifications]", take: TAKE_EXISTS }
    pipe:
      - default: { value: "false" }

  - path: post.text          # JSON-LD marks embeds with a placeholder line
    expect: true
    candidates:
      - json_ld: { types: [WebPage], path: "mainEntity.text" }
        pipe:
          - regex_replace: { pattern: "\\s*\\[contains quote post or other embedded content\\]$", with: "" }
      - css: { selector: "[data-testid^=postThreadItem-by-]:has([data-testid=likeCount-expanded]) [data-word-wrap]" }
        pipe:
          - slice: { start: 0, end: 1 }

  - path: post.published_at
    candidates:
      - json_ld: { types: [WebPage], path: "mainEntity.datePublished" }

  - path: post.likes          # JSON-LD has the exact count; the page shows "63K"
    candidates:
      - json_ld: { types: [WebPage], path: "mainEntity.interactionStatistic[interactionType=LikeAction].userInteractionCount" }
      - css: { selector: "[data-testid=likeCount-expanded]" }
    pipe:
      - number: {}

  - path: post.reposts
    candidates:
      # The label/value pair "Reposts"; JSON-LD's ShareAction also counts quotes.
      - css: { selector: "meta[name^='twitter:label'][content=Reposts] + meta[name^='twitter:value']", take: TAKE_ATTRIBUTE, attribute: content, scope: CSS_SCOPE_DOCUMENT }
      - css: { selector: "[data-testid=repostCount-expanded]" }
    pipe:
      - number: {}

  - path: post.replies
    candidates:
      - json_ld: { types: [WebPage], path: "mainEntity.commentCount" }
      - css: { selector: "[data-testid^=postThreadItem-by-]:has([data-testid=likeCount-expanded]) [data-testid=replyBtn]" }
        pipe:
          - slice: { start: 0, end: 1 }
          - number: {}

  - path: reply_count
    candidates:
      - field: { path: post.replies }

  - path: replies
    each: "[data-testid^=postThreadItem-by-]:not(:has([data-testid=likeCount-expanded]))"
    fields:
      - path: id
        candidates:
          - css: { selector: "a[href*='/post/'][aria-label]", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "/post/([a-z0-9]+)$", group: 1 }
      - path: url
        candidates:
          - css: { selector: "a[href*='/post/'][aria-label]", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - url: {}
      - path: author.name
        candidates:
          - css: { selector: "a[aria-label$=' profile']" }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: author.handle    # data-testid="postThreadItem-by-<handle>"
        candidates:
          - css: { take: TAKE_ATTRIBUTE, attribute: data-testid }
        pipe:
          - regex_replace: { pattern: "^postThreadItem-by-", with: "" }
      - path: text             # mentions render as block-level divs: rejoin them with the sentence
        candidates:
          - css: { selector: "[data-word-wrap]" }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex_replace: { pattern: "\\n\\n(@[^\\s]+)\\n\\n", with: " $1 " }
      - path: likes
        candidates:
          - css: { selector: "[data-testid=likeCount]" }
        pipe:
          - slice: { start: 0, end: 1 }
          - number: {}
      - path: reposts
        candidates:
          - css: { selector: "[data-testid=repostCount]" }
        pipe:
          - slice: { start: 0, end: 1 }
          - number: {}
      - path: replies
        candidates:
          - css: { selector: "[data-testid=replyBtn]" }
        pipe:
          - slice: { start: 0, end: 1 }
          - number: {}
