# DuckDuckGo web results -> rex.schema.search.v1.SearchResults (decisions.md U35). Rendered page; results are
# article[data-testid=result] with direct (non-redirect) links. The Search Assist answer is not a result.
id: duckduckgo.com/search
version: 1
schema: rex.schema.search.v1.SearchResults
match:
  urls:
    hosts: ["duckduckgo.com"]
    include: ["^/\\?(.*&)?q="]
  page:
    all:
      - exists: "article[data-testid=result]"
fields:
  - path: query
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: q }

  - path: engine
    candidates:
      - constant: { value: "duckduckgo" }

  - path: results
    expect: true
    each: "article[data-testid=result]"
    each_index: rank
    fields:
      - path: type
        candidates:
          - constant: { value: "RESULT_TYPE_ORGANIC" }
      - path: title
        candidates:
          - css: { selector: "a[data-testid=result-title-a]" }
      - path: url
        candidates:
          - css: { selector: "a[data-testid=result-title-a]", take: TAKE_ATTRIBUTE, attribute: href }
      - path: display_url
        candidates:
          - css: { selector: "a[data-testid=result-extras-url-link]" }
      - path: snippet
        candidates:
          - css: { selector: "[data-result=snippet]" }
      - path: sitelinks
        each: "li[id^=sl-]"
        fields:
          - path: title
            candidates:
              - css: { selector: "h3" }
          - path: url
            candidates:
              - css: { selector: "a", take: TAKE_ATTRIBUTE, attribute: href }
            pipe:
              - slice: { start: 0, end: 1 }
