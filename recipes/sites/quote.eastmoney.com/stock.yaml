# Eastmoney A-share quote page -> rex.schema.finance.v1.Quote (decisions.md U37). Rendered page only: values
# arrive after load (before the 09:30 open the price shows "-" and drops out). The brief table is label/value
# cells ("今开：" "1286.00"), read from the table text. Volume is in 手 (lots of 100 shares) and is converted.
id: quote.eastmoney.com/stock
version: 1
schema: rex.schema.finance.v1.Quote
match:
  urls:
    hosts: ["quote.eastmoney.com"]
    include: ["^/(sh|sz|bj)\\d{6}\\.html"]
  page:
    all:
      - exists: ".brief_info_c"
fields:
  - path: symbol
    candidates:
      - url: { part: URL_PART_HREF }
        pipe:
          - regex: { pattern: "/(?:sh|sz|bj)(\\d{6})\\.html", group: 1 }

  - path: exchange
    candidates:
      - url: { part: URL_PART_HREF }
        pipe:
          - regex: { pattern: "/(sh|sz|bj)\\d{6}\\.html", group: 1 }
          - map: { entries: [ { from: "sh", to: "SSE" }, { from: "sz", to: "SZSE" }, { from: "bj", to: "BSE" } ] }

  - path: name               # "贵州茅台 600519 更名 ..."
    candidates:
      - css: { selector: ".quote_title" }
    pipe:
      - regex: { pattern: "^(.+?)\\s*\\d{6}", group: 1 }

  - path: type
    candidates:
      - constant: { value: "INSTRUMENT_TYPE_STOCK" }

  - path: currency
    candidates:
      - constant: { value: "CNY" }

  - path: price
    expect: true
    candidates:
      - css: { selector: ".zxj" }
    pipe:
      - filter: { pattern: "\\d" }

  - path: change
    candidates:
      - css: { selector: ".zd span" }
    pipe:
      - filter: { pattern: "^[-+]?[\\d.]+$" }
      - slice: { start: 0, end: 1 }

  - path: change_percent
    candidates:
      - css: { selector: ".zd span" }
    pipe:
      - filter: { pattern: "%$" }
      - slice: { start: 0, end: 1 }

  - path: previous_close
    candidates:
      - css: { selector: ".brief_info_c" }
    pipe:
      - regex: { pattern: "昨收：\\s*([\\d.]+)", group: 1 }

  - path: open
    candidates:
      - css: { selector: ".brief_info_c" }
    pipe:
      - regex: { pattern: "今开：\\s*([\\d.]+)", group: 1 }

  - path: day_high
    candidates:
      - css: { selector: ".brief_info_c" }
    pipe:
      - regex: { pattern: "最高：\\s*([\\d.]+)", group: 1 }

  - path: day_low
    candidates:
      - css: { selector: ".brief_info_c" }
    pipe:
      - regex: { pattern: "最低：\\s*([\\d.]+)", group: 1 }

  - path: volume             # 手 -> shares
    candidates:
      - css: { selector: ".brief_info_c" }
    pipe:
      - regex: { pattern: "成交量：\\s*([\\d.]+[万亿]?)", group: 1 }
      - number: { cjk_units: true }
      - regex_replace: { pattern: "^(\\d+)$", with: "${1}00" }

  - path: market_cap         # "1.620万亿"
    candidates:
      - css: { selector: ".brief_info_c" }
    pipe:
      - regex: { pattern: "总市值：\\s*([\\d.]+[万亿]*)", group: 1 }
      - number: { cjk_units: true }

  - path: pe_ratio           # dynamic P/E, the only one shown here
    candidates:
      - css: { selector: ".brief_info_c td.n + td" }
    pipe:
      - slice: { start: 5, end: 6 }

  - path: stats
    each: ".brief_info_c td.n"
    fields:
      - path: name
        candidates:
          - css: { take: TAKE_OWN_TEXT }
        pipe:
          - regex_replace: { pattern: "[：:]\\s*$", with: "" }
      - path: value
        candidates:
          - css: { selector: "+ td" }

  - path: url
    candidates:
      - url: { part: URL_PART_HREF }
