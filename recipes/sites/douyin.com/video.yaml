# Douyin video page -> rex.schema.media.v1.Video (decisions.md U34). Rendered page only. Douyin shows no
# view count; the title doubles as the description (with a "第N集 |" series prefix on collections).
id: douyin.com/video
version: 1
schema: rex.schema.media.v1.Video
extends: generic/video.v1
match:
  urls:
    hosts: ["douyin.com"]
    include: ["^/video/\\d+"]
  page:
    all:
      - exists: "[data-e2e=detail-video-info]"
fields:
  - path: id
    candidates:
      - url: { part: URL_PART_PATH_SEGMENT, segment: 1 }

  - path: title
    expect: true
    candidates:
      - css: { selector: "[data-e2e=detail-video-info] h1" }
      - css: { selector: "h1" }
    pipe:
      - slice: { start: 0, end: 1 }
      - regex_replace: { pattern: "^第\\d+集\\s*\\|\\s*", with: "" }

  - path: url
    replace_inherited: true
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "^(https://[^/]+/video/\\d+)", group: 1 }

  - path: channel.name
    candidates:
      - css: { selector: "[data-e2e=user-info] span" }
    pipe:
      - filter: { pattern: "\\S" }
      - slice: { start: 0, end: 1 }

  - path: channel.url
    candidates:
      - css: { selector: "[data-e2e=user-info] a", take: TAKE_ATTRIBUTE, attribute: href }
    pipe:
      - slice: { start: 0, end: 1 }

  - path: published_at        # "发布时间：2026-07-21 21:11"
    candidates:
      - css: { selector: "[data-e2e=detail-video-publish-time]" }
    pipe:
      - regex: { pattern: "(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2})", group: 1 }
      - datetime: { formats: ["%Y-%m-%d %H:%M"], tz: "Asia/Shanghai" }

  - path: likes
    candidates:
      - css: { selector: "[data-e2e=video-player-digg]" }
    pipe:
      - number: { cjk_units: true }

  - path: description
    replace_inherited: true
    candidates:
      - field: { path: title }

  - path: tags                # the page keywords end with Douyin's own site words
    replace_inherited: true
    candidates:
      - meta: { key: "keywords" }
    pipe:
      - split: { pattern: "\\s*,\\s*" }
      - filter: { pattern: "^抖音", invert: true }
