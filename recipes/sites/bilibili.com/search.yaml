# Bilibili search results -> rex.schema.media.v1.VideoList (decisions.md U34). Ad cards have no /video/ link
# and drop out (id is required). Dates are "2020年10月21日", "7月13日" (this year) or relative ("14小时前").
id: bilibili.com/search
version: 2
schema: rex.schema.media.v1.VideoList
requires: [relative_dates]
match:
  urls:
    hosts: ["search.bilibili.com"]
    # An optional locale segment: plain HTTP is now redirected to /zh-Hans/all?... (found by the liveness run).
    include: ["^/(?:[a-z]{2}(?:-[A-Za-z]{2,4})?/)?(all|video)\\?"]
  page:
    all:
      - exists: ".bili-video-card"
fields:
  - path: query
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: keyword }

  - path: items
    expect: true
    each: ".bili-video-card"
    each_index: rank
    fields:
      - path: id
        candidates:
          - css: { selector: "a[href*='/video/BV']", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "/video/(BV[0-9A-Za-z]+)", group: 1 }
      - path: title
        candidates:
          - css: { selector: ".bili-video-card__info--tit", take: TAKE_ATTRIBUTE, attribute: title }
      - path: url
        candidates:
          - css: { selector: "a[href*='/video/BV']", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: channel_name
        candidates:
          - css: { selector: ".bili-video-card__info--author" }
      - path: channel_url
        candidates:
          - css: { selector: ".bili-video-card__info--owner", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - filter: { pattern: "space\\.bilibili\\.com" }
      - path: duration_seconds
        candidates:
          - css: { selector: ".bili-video-card__stats__duration" }
        pipe:
          - duration: {}
      - path: views           # first counter is plays, second is danmaku
        candidates:
          - css: { selector: ".bili-video-card__stats--item" }
        pipe:
          - slice: { start: 0, end: 1 }
          - number: { cjk_units: true }
      - path: published_at
        candidates:
          - css: { selector: ".bili-video-card__info--date" }
        pipe:
          - regex_replace: { pattern: "^[·\\s]+", with: "" }
          - datetime: { formats: ["%Y年%m月%d日", "%Y-%m-%d"], tz: "Asia/Shanghai", relative: true }
      - path: thumbnail
        candidates:
          - css: { selector: "img", take: TAKE_ATTRIBUTE, attribute: src }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex_replace: { pattern: "@.*$", with: "" }
