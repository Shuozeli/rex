# Walmart search results -> rex.schema.commerce.v1.ProductList (decisions.md U35). Every tile is
# [data-item-id]; the tile's link carries the real item id in `link-identifier`. Sponsored tiles link through
# /sp/track?...&rd=<percent-encoded item URL>, which is unwrapped. Prices come from the accessible price text
# ("Price Now $16.99 Was $35.98" / "current price Now $22.99"); the visible digits are split into spans.
id: walmart.com/search
version: 1
schema: rex.schema.commerce.v1.ProductList
match:
  urls:
    hosts: ["walmart.com"]
    include: ["^/search\\?", "^/search/"]
  page:
    all:
      - exists: "[data-item-id]"
fields:
  - path: query
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: q }

  - path: page
    candidates:
      - url: { part: URL_PART_QUERY_PARAM, query_param: page }
    pipe:
      - default: { value: "1" }

  - path: items
    expect: true
    each: "[data-item-id]"
    each_index: rank
    fields:
      - path: id
        candidates:
          - css: { selector: "a[link-identifier]", take: TAKE_ATTRIBUTE, attribute: link-identifier }
            pipe:
              - slice: { start: 0, end: 1 }
              - filter: { pattern: "^\\d+$" }
          - css: { take: TAKE_ATTRIBUTE, attribute: data-item-id }
      - path: title
        candidates:
          - css: { selector: "[data-automation-id=product-title]" }
      - path: url
        candidates:
          - css: { selector: "a[link-identifier]", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex_replace: { pattern: "^.*[?&]rd=([^&]+).*$", with: "$1" }
          - decode: { kind: DECODE_KIND_PERCENT }
          - regex_replace: { pattern: "[?#].*$", with: "" }
      - path: price
        candidates:
          - css: { selector: "[data-testid=unified-global-product-price-a11y-text]" }
          - css: { selector: "[data-automation-id=product-price] span" }
        pipe:
          - filter: { pattern: "\\$\\d" }
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "\\$([\\d,]+(?:\\.\\d\\d)?)", group: 1 }
          - number: {}
      - path: currency
        candidates:
          - constant: { value: "USD" }
      - path: rating           # "5 out of 5 stars"
        candidates:
          - css: { selector: "[data-testid=rating-container]" }
        pipe:
          - regex: { pattern: "^([\\d.]+) out of", group: 1 }
      - path: review_count
        candidates:
          - css: { selector: "[data-testid=product-reviews]", take: TAKE_ATTRIBUTE, attribute: data-value }
      - path: image
        candidates:
          - css: { selector: "img[data-testid=productTileImage]", take: TAKE_ATTRIBUTE, attribute: src }
        pipe:
          - regex_replace: { pattern: "\\?.*$", with: "" }
      - path: sponsored
        candidates:
          - css: { selector: "a[link-identifier]", take: TAKE_ATTRIBUTE, attribute: href }
            pipe:
              - slice: { start: 0, end: 1 }
              - regex: { pattern: "(/sp/track)", group: 1 }
              - map: { entries: [ { from: "/sp/track", to: "true" } ] }
        pipe:
          - default: { value: "false" }
