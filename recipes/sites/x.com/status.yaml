# X / Twitter post page -> rex.schema.social.v1.Thread (decisions.md U33). Needs the rendered, logged-in page.
# The focal post is the tweet article with tabindex="-1"; the other articles (parents above, replies below)
# are the replies. Metrics come from the action bar's aria-label ("397 replies, 1574 reposts, 9882 likes, ...").
id: x.com/status
version: 1
schema: rex.schema.social.v1.Thread
match:
  urls:
    hosts: ["x.com", "twitter.com", "mobile.twitter.com"]
    include: ["^/[A-Za-z0-9_]+/status/\\d+"]
  page:
    all:
      - exists: "article[data-testid=tweet]"
fields:
  - path: url
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "^(https://[^/]+/[A-Za-z0-9_]+/status/\\d+)", group: 1 }

  - path: post.id
    candidates:
      - url: { part: URL_PART_HREF }
    pipe:
      - regex: { pattern: "/status/(\\d+)", group: 1 }

  - path: post.author.name
    expect: true
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [data-testid=User-Name] a span", scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: 0, end: 1 }

  - path: post.author.handle
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [data-testid=User-Name] a", take: TAKE_ATTRIBUTE, attribute: href, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: 0, end: 1 }
      - regex: { pattern: "^/([A-Za-z0-9_]+)$", group: 1 }

  - path: post.author.url
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [data-testid=User-Name] a", take: TAKE_ATTRIBUTE, attribute: href, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: 0, end: 1 }

  - path: post.author.verified
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [data-testid=User-Name] [data-testid=icon-verified]", take: TAKE_EXISTS, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - default: { value: "false" }

  - path: post.text
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [data-testid=tweetText]", scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: 0, end: 1 }

  - path: post.published_at
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] time", take: TAKE_ATTRIBUTE, attribute: datetime, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: 0, end: 1 }

  - path: post.replies
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - regex: { pattern: "(\\d+) repl", group: 1 }

  - path: post.reposts
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - regex: { pattern: "(\\d+) repost", group: 1 }

  - path: post.likes
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - regex: { pattern: "(\\d+) like", group: 1 }

  - path: post.views
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - regex: { pattern: "(\\d+) view", group: 1 }

  - path: post.media
    candidates:
      - css: { selector: "article[data-testid=tweet][tabindex='-1'] [data-testid=tweetPhoto] img", take: TAKE_ATTRIBUTE, attribute: src, scope: CSS_SCOPE_DOCUMENT }

  - path: post.url
    candidates:
      - field: { path: url }

  - path: reply_count
    candidates:
      - field: { path: post.replies }

  - path: replies
    each: "article[data-testid=tweet][tabindex='0']"
    fields:
      - path: id
        candidates:
          - css: { selector: "a[href*='/status/']", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "/status/(\\d+)", group: 1 }
      - path: author.name
        candidates:
          - css: { selector: "[data-testid=User-Name] a span" }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: author.handle
        candidates:
          - css: { selector: "[data-testid=User-Name] a", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "^/([A-Za-z0-9_]+)$", group: 1 }
      - path: text
        candidates:
          - css: { selector: "[data-testid=tweetText]" }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: published_at
        candidates:
          - css: { selector: "time", take: TAKE_ATTRIBUTE, attribute: datetime }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: likes
        candidates:
          - css: { selector: "[role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label }
        pipe:
          - regex: { pattern: "(\\d+) like", group: 1 }
      - path: replies
        candidates:
          - css: { selector: "[role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label }
        pipe:
          - regex: { pattern: "(\\d+) repl", group: 1 }
      - path: url
        candidates:
          - css: { selector: "a[href*='/status/']", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "^(/[A-Za-z0-9_]+/status/\\d+)", group: 1 }
