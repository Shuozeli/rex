# X / Twitter profile timeline -> rex.schema.social.v1.PostList (decisions.md U33). Needs the rendered,
# logged-in page; only the posts X has rendered are present (it virtualizes the timeline).
id: x.com/profile
version: 1
schema: rex.schema.social.v1.PostList
match:
  urls:
    hosts: ["x.com", "twitter.com", "mobile.twitter.com"]
    include: ["^/[A-Za-z0-9_]+/?(?:\\?.*)?$"]
    exclude: ["^/(?:home|explore|notifications|messages|search|settings|i)(?:/|$|\\?)"]
  page:
    all:
      - exists: "[data-testid=UserName]"
fields:
  - path: title
    candidates:
      - css: { selector: "title", scope: CSS_SCOPE_DOCUMENT }

  - path: owner.name
    candidates:
      - css: { selector: "[data-testid=UserName] span", scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - slice: { start: 0, end: 1 }

  - path: owner.handle
    candidates:
      - url: { part: URL_PART_PATH_SEGMENT, segment: 0 }

  - path: owner.url
    candidates:
      - url: { part: URL_PART_HREF }

  - path: owner.verified
    candidates:
      - css: { selector: "[data-testid=UserName] [data-testid=icon-verified]", take: TAKE_EXISTS, scope: CSS_SCOPE_DOCUMENT }
    pipe:
      - default: { value: "false" }

  - path: posts
    expect: true
    each: "article[data-testid=tweet]"
    fields:
      - path: id
        candidates:
          - css: { selector: "a[href*='/status/']", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "/status/(\\d+)", group: 1 }
      - path: author.name
        candidates:
          - css: { selector: "[data-testid=User-Name] a span" }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: author.handle
        candidates:
          - css: { selector: "[data-testid=User-Name] a", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "^/([A-Za-z0-9_]+)$", group: 1 }
      - path: text
        candidates:
          - css: { selector: "[data-testid=tweetText]" }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: published_at
        candidates:
          - css: { selector: "time", take: TAKE_ATTRIBUTE, attribute: datetime }
        pipe:
          - slice: { start: 0, end: 1 }
      - path: replies
        candidates:
          - css: { selector: "[role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label }
        pipe:
          - regex: { pattern: "(\\d+) repl", group: 1 }
      - path: reposts
        candidates:
          - css: { selector: "[role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label }
        pipe:
          - regex: { pattern: "(\\d+) repost", group: 1 }
      - path: likes
        candidates:
          - css: { selector: "[role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label }
        pipe:
          - regex: { pattern: "(\\d+) like", group: 1 }
      - path: views
        candidates:
          - css: { selector: "[role=group]", take: TAKE_ATTRIBUTE, attribute: aria-label }
        pipe:
          - regex: { pattern: "(\\d+) view", group: 1 }
      - path: media
        candidates:
          - css: { selector: "[data-testid=tweetPhoto] img", take: TAKE_ATTRIBUTE, attribute: src }
      - path: url
        candidates:
          - css: { selector: "a[href*='/status/']", take: TAKE_ATTRIBUTE, attribute: href }
        pipe:
          - slice: { start: 0, end: 1 }
          - regex: { pattern: "^(/[A-Za-z0-9_]+/status/\\d+)", group: 1 }
