# Baseline for rex.schema.howto.v1.Recipe: any page with schema.org Recipe data (JSON-LD or microdata), as
# required for Google's recipe rich results. Site recipes `extends` this.
id: generic/recipe.v1
version: 2
schema: rex.schema.howto.v1.Recipe
fields:
  - path: name
    candidates:
      - json_ld: {}
      - microdata: {}
      - meta: { key: "og:title" }
    pipe:
      - strip_site_name: {}    # og:title is often "Post - Site" (decisions.md U44)

  - path: description
    candidates:
      - json_ld: {}
      - microdata: {}
      - meta: { key: "og:description" }

  - path: authors
    candidates:
      - json_ld: {}
      - microdata: {}

  - path: published_at
    candidates:
      - json_ld: {}
      - microdata: {}
      - meta: { key: "article:published_time" }

  - path: image
    candidates:
      - json_ld: {}
      - microdata: {}
      - meta: { key: "og:image" }

  - path: url
    candidates:
      - link: { rel: canonical }
      - meta: { key: "og:url" }
      - url: { part: URL_PART_HREF }

  - path: prep_time_seconds
    candidates:
      - json_ld: { path: "prepTime" }
      - microdata: { path: "prepTime" }
    pipe:
      - duration: {}

  - path: cook_time_seconds
    candidates:
      - json_ld: { path: "cookTime" }
      - microdata: { path: "cookTime" }
    pipe:
      - duration: {}

  - path: total_time_seconds
    candidates:
      - json_ld: { path: "totalTime" }
      - microdata: { path: "totalTime" }
    pipe:
      - duration: {}

  - path: yield              # often ["4", "4 servings"]: the longer form is the readable one
    candidates:
      - json_ld: {}
      - microdata: {}
    pipe:
      - slice: { start: -1, end: 0 }

  - path: category
    candidates:
      - json_ld: {}
      - microdata: {}

  - path: cuisine
    candidates:
      - json_ld: {}
      - microdata: {}

  - path: keywords
    candidates:
      # Parse.ly's tags are the editors' topic labels; JSON-LD keywords can be CMS flags ("publisher-tested").
      - meta: { key: "parsely-tags" }
      - json_ld: { path: "keywords" }
      - microdata: { path: "keywords" }
    pipe:
      - split: { pattern: "\\s*,\\s*" }
      - drop_codes: {}
      - unique: { ignore_case: true }

  - path: ingredients
    candidates:
      - json_ld: {}
      - json_ld: { path: "ingredients" }
      - microdata: { path: "recipeIngredient" }

  - path: steps              # sections (HowToSection) first, then flat steps or plain strings
    candidates:
      - json_ld: { path: "recipeInstructions.itemListElement" }
      - json_ld: { path: "recipeInstructions" }
      - microdata: { path: "recipeInstructions" }

  - path: rating
    candidates:
      - json_ld: { path: "aggregateRating.ratingValue" }
      - microdata: { path: "aggregateRating.ratingValue" }

  - path: rating_count
    candidates:
      - json_ld: { path: "aggregateRating.ratingCount" }
      - json_ld: { path: "aggregateRating.reviewCount" }
      - microdata: { path: "aggregateRating.ratingCount" }

  - path: calories
    candidates:
      - json_ld: { path: "nutrition.calories" }
      - microdata: { path: "nutrition.calories" }
