// rex.schema.job.v1: one job posting page.
//
// Decided 2026-10-14 (decisions.md U36, schema.org bases; delegated, open to revision).
syntax = "proto3";

package rex.schema.job.v1;

import "google/protobuf/timestamp.proto";
import "rex/schema/common/v1/common.proto";
import "rex/schema/v1/annotations.proto";

message JobPosting {
  option (rex.schema.v1.record) = {
    schema_org: "JobPosting"
    primary: ["company", "description_text"]
    fallback_rank: 20
  };

  string id = 1;                           // the site's or employer's posting id
  string title = 2 [(rex.schema.v1.field) = { schema_org: "title", required: true }];
  rex.schema.common.v1.Organization company = 3 [(rex.schema.v1.field) = { schema_org: "hiringOrganization" }];
  repeated rex.schema.common.v1.PostalAddress locations = 4 [(rex.schema.v1.field) = { max_items: 50 }];
  bool remote = 5;                         // schema.org jobLocationType TELECOMMUTE
  repeated string employment_types = 6 [(rex.schema.v1.field) = { schema_org: "employmentType", max_items: 10 }];   // FULL_TIME, CONTRACTOR
  Salary salary = 7;
  google.protobuf.Timestamp posted_at = 8 [(rex.schema.v1.field) = { schema_org: "datePosted" }];
  google.protobuf.Timestamp valid_through = 9 [(rex.schema.v1.field) = { schema_org: "validThrough" }];
  string description_html = 10 [(rex.schema.v1.field) = { kind: VALUE_KIND_HTML }];
  string description_text = 11 [(rex.schema.v1.field) = { kind: VALUE_KIND_TEXT }];
  string url = 12 [(rex.schema.v1.field) = { kind: VALUE_KIND_URL, schema_org: "url" }];
  string apply_url = 13 [(rex.schema.v1.field) = { kind: VALUE_KIND_URL }];
}

message Salary {
  option (rex.schema.v1.record) = { schema_org: "MonetaryAmount" };

  string min = 1 [(rex.schema.v1.field) = { kind: VALUE_KIND_DECIMAL }];
  string max = 2 [(rex.schema.v1.field) = { kind: VALUE_KIND_DECIMAL }];
  string currency = 3 [(rex.schema.v1.field) = { schema_org: "currency" }];
  string unit = 4;                         // HOUR, DAY, WEEK, MONTH, YEAR
}
