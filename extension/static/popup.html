<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rex</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<!-- The title, the view switch, the status and the actions stay at the top, next to the toolbar icon the
     popup opens from, while the record scrolls below them. -->
<div class="sticky">
<header class="top">
  <div class="brand"><img class="logo" src="icons/icon-32.png" alt=""> rex</div>
  <div class="views" id="views" role="tablist">
    <button id="viewReader" role="tab" data-view="reader" data-i18n="viewReader"></button>
    <button id="viewTable" role="tab" data-view="table" data-i18n="viewTable"></button>
  </div>
  <span id="status" class="state">…</span>
</header>
<section class="actions" id="actions" hidden>
  <button id="copy" class="primary" data-i18n="copyJson"></button>
  <button id="download" data-i18n="download"></button>
  <button id="copyOther" class="quiet"></button>
  <button id="fixture" class="quiet" hidden data-i18n="saveFixture"></button>
  <button id="report" class="warn" hidden data-i18n="reportBroken"></button>
</section>
<label class="optin" id="reportUrlRow" hidden><input type="checkbox" id="reportUrl"> <span data-i18n="reportIncludeUrl"></span></label>
</div>
<section id="message" class="message" hidden></section>
<section id="alts" class="alts" hidden></section>
<main id="record" class="record"></main>
<section id="meta" class="meta"></section>
<section id="json" class="json" hidden>
  <div class="json-head"><b>JSON</b> <span id="jsonNote"></span></div>
  <pre id="jsonView"></pre>
</section>
<details id="details" class="details" hidden>
  <summary data-i18n="traceSummary"></summary>
  <div id="trace"></div>
</details>
<footer class="foot">
  <span id="bundle">…</span>
  <span class="links"><a href="#" id="refresh" data-i18n="refreshRecipes"></a> · <a href="options.html" target="_blank" data-i18n="options"></a></span>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
