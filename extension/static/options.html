<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rex options</title>
<link rel="stylesheet" href="popup.css">
<style>
  body { width: auto; max-width: 860px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 28px; height: 28px; }
  h2 { font-size: 14px; margin: 22px 0 6px; }
  textarea {
    font: inherit; font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; box-sizing: border-box; }
  textarea { font-family: ui-monospace, Menlo, monospace; resize: vertical; }
  #localRecipe { width: 100%; min-height: 160px; }
  .st { white-space: pre-wrap; word-break: break-all; }
  .st.err { color: var(--bad); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 20px 0; }
  label.line { display: block; margin: 4px 0; }
  #errors { white-space: pre-wrap; }
</style>
</head>
<body>
<h1><img src="icons/icon-48.png" alt=""><span data-i18n="optionsTitle"></span></h1>

<h2 data-i18n="optRecipesHeading"></h2>
<p class="meta" data-i18n="optRecipesHelp"></p>
<p id="recipes" class="st"></p>

<h2 data-i18n="optOutputHeading"></h2>
<label class="line"><input type="radio" name="format" value="envelope"> <span data-i18n="outputEnvelope"></span></label>
<label class="line"><input type="radio" name="format" value="record"> <span data-i18n="outputRecord"></span></label>

<h2 data-i18n="optDevHeading"></h2>
<label class="line"><input type="checkbox" id="devMode"> <span data-i18n="devModeLabel"></span></label>
<div id="devBox" hidden>
  <p class="meta" data-i18n="localRecipeLabel"></p>
  <textarea id="localRecipe" spellcheck="false" placeholder='{"id": "example.com/article", "version": 1, ...}'></textarea>
  <div class="bar" style="margin: 6px 0">
    <label><input type="checkbox" id="localEnabled"> <span data-i18n="localRecipeEnable"></span></label>
    <button id="validate" data-i18n="validate"></button>
    <span id="validateResult" class="meta"></span>
  </div>
</div>

<div class="bar">
  <button id="save" class="primary" data-i18n="save"></button>
  <span id="result" class="meta"></span>
</div>
<div id="errors" class="message error" hidden></div>
<script type="module" src="options.js"></script>
</body>
</html>
